<!doctype html>
<!-- Source of assets/img/og-card.png (the link-preview image). Open at 1200 x 630 and screenshot to regenerate. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Inter+Tight:wght@400..700&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#F4EFE4;color:#211D15;font-family:"Inter Tight",Arial,sans-serif;position:relative;overflow:hidden}
.in{position:absolute;inset:64px 72px;display:flex;flex-direction:column}
.lab{font-size:20px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#A04E17}
h1{font-family:Newsreader,Georgia,serif;font-weight:300;font-size:168px;letter-spacing:-.035em;line-height:.9;margin:34px 0 0}
p{margin:auto 0 0;font-size:30px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #211D15;padding-top:22px}
p span{font-weight:400;color:#6E6656;font-size:24px}
.reg{position:absolute;width:22px;height:22px;border:solid #6E6656;opacity:.7}
.r1{top:28px;left:28px;border-width:1.5px 0 0 1.5px}.r2{bottom:28px;right:28px;border-width:0 1.5px 1.5px 0}
.bar{position:absolute;right:72px;top:64px;width:260px;height:6px;background:#C56722}
</style></head><body>
<i class="reg r1"></i><i class="reg r2"></i><i class="bar"></i>
<div class="in"><div class="lab">Electrical engineering, UCLA</div>
<h1>Wesley<br>Hon</h1>
<p>Power electronics, controls and embedded hardware<span>Portfolio</span></p></div>
